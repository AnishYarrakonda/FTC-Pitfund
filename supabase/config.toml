# Local Supabase stack for FTC Pitfund (v2). Started by `npm run setup`.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
#
# Values read with env(...) come from supabase/.env, which `npm run setup` generates
# (gitignored). Production auth settings are applied by scripts/provision, not this file.
project_id = "ftc-pitfund"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
# Migrations are Drizzle's (drizzle/), applied by `npm run db:migrate`, not the CLI.
enabled = false

[db.seed]
# Seeding is `npm run seed -- --scenario demo|empty|edge`.
enabled = false

[realtime]
# Nothing in the product needs realtime.
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Mailpit. Every email the app sends locally lands here: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.public]
public = true
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/webp", "image/png", "image/jpeg"]

[storage.buckets.staging]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf", "image/*"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://127.0.0.1:3100/auth/callback",
  "http://localhost:3100/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.rate_limit]
# Generous locally so E2E runs are not throttled; the app's own copy handles 429s.
email_sent = 1000
sms_sent = 0
anonymous_users = 0
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
web3 = 0

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
# Minimum time between two codes for the same address. The login page counts down 30 s.
max_frequency = "5s"
otp_length = 6
otp_expiry = 600

# Every auth email goes through the app's outbox (branded, quota-aware).
[auth.hook.send_email]
enabled = true
uri = "http://host.docker.internal:3000/api/auth/send-email"
secrets = "env(SEND_EMAIL_HOOK_SECRET)"

[auth.sms]
enable_signup = false

[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

# Google is enabled only when credentials exist (setup writes these from .env.local).
[auth.external.google]
enabled = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_ENABLED)"
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
