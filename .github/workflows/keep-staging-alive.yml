name: Keep staging Supabase project alive

# Supabase free-tier projects auto-pause after about 7 days without enough activity. This repo's staging
# project (ftc-pitfund-staging, provisioned by `npm run provision`) backs Vercel *preview* deployments
# only; production never touches it. It gets no organic traffic, so this workflow supplies some.
#
# Each run does a read, then a write, then a delete, through PostgREST against cron_runs. Nobody has
# shown which kind of activity Supabase counts, so the run covers all three and leaves the table as it
# was. The write is a `keepalive` row; the delete removes that same row by its id.
#
# Uses SUPABASE_STAGING_SECRET_KEY (a GitHub secret: it bypasses RLS, so it is never committed).
# GitHub disables scheduled workflows after 60 days without a push to the repo; if staging gets a
# pause email after a quiet stretch, re-enable this workflow under Actions.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_STAGING_SECRET_KEY: ${{ secrets.SUPABASE_STAGING_SECRET_KEY }}
      REST_URL: https://rrnmwupvdzgwcsgshvnj.supabase.co/rest/v1/cron_runs
    steps:
      - name: Read the latest keepalive row
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' \
            -H "apikey: $SUPABASE_STAGING_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_STAGING_SECRET_KEY" \
            "$REST_URL?select=id,started_at&job=eq.keepalive&order=started_at.desc&limit=1")
          cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "Read failed with status $code"
            exit 1
          fi

      - name: Write a keepalive row
        run: |
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          code=$(curl -s -o body.json -w '%{http_code}' -X POST \
            -H "apikey: $SUPABASE_STAGING_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_STAGING_SECRET_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"job\":\"keepalive\",\"started_at\":\"$now\",\"finished_at\":\"$now\",\"ok\":true,\"detail\":{\"result\":{\"source\":\"github-actions\"}}}" \
            "$REST_URL")
          cat body.json; echo
          if [ "$code" != "201" ]; then
            echo "Write failed with status $code"
            exit 1
          fi
          jq -r '.[0].id' body.json > row_id.txt

      - name: Delete the row it just wrote
        run: |
          id=$(cat row_id.txt)
          code=$(curl -s -o body.json -w '%{http_code}' -X DELETE \
            -H "apikey: $SUPABASE_STAGING_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_STAGING_SECRET_KEY" \
            -H "Prefer: return=representation" \
            "$REST_URL?id=eq.$id")
          cat body.json; echo
          if [ "$code" != "200" ]; then
            echo "Delete failed with status $code"
            exit 1
          fi
