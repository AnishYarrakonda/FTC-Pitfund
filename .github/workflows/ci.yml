name: CI

# typecheck · lint → local Supabase (start, migrate, seed) → unit/integration tests → build
#   → E2E → QA gate (every scenario project in playwright.qa.config.ts) → perf budgets → knip.
# Everything runs against the throwaway local stack inside the runner; no secrets are needed.
# `npm run setup` writes .env.local and supabase/.env; every later step reads them from disk.
# Once the build succeeds, E2E, QA, perf and knip each run even if an earlier one failed, so a
# single run reports every broken gate (the job still fails).

on:
  push:
    branches: [main, rebuild]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Local Supabase, migrations and demo seed
        run: npm run setup

      - name: Unit and integration tests
        run: npm run test

      - name: Cache Next build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'lib/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        id: build
        run: npm run build

      - name: Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Skips the download when the cached browser matches; always installs the system libraries.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E
        id: e2e
        run: npm run e2e

      # Reseeds per scenario: demo, then edge, then empty.
      - name: QA gate
        id: qa
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run qa

      - name: Performance budgets
        id: perf
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run perf

      - name: Security scan (build secrets, anon REST, /dev in production, non-goals)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run security:scan

      - name: Production dependency audit (high and critical)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high

      - name: Unused files, exports and dependencies
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run knip

      - name: Upload QA report and perf results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-report
          path: |
            qa/report.md
            qa/report.json
            qa/results
            qa/perf
          if-no-files-found: ignore
          retention-days: 14

      # Large: only when QA fails. PNGs are already compressed, so skip re-zipping them.
      - name: Upload QA screenshots
        if: ${{ !cancelled() && steps.qa.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-screens
          path: qa/screens
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
